<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Eya Jmaa</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07080d" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%2307080d'/><circle cx='20' cy='22' r='5' fill='%238b7cff'/><circle cx='44' cy='22' r='5' fill='%234fd1c5'/><circle cx='32' cy='44' r='5' fill='%23e7e9f0'/><path d='M20 22L44 22L32 44Z' stroke='%238b7cff' stroke-width='2' fill='none' opacity='.6'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- absolute paths so the page works at any missing URL depth -->
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .nf { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px; position: relative; overflow: hidden; }
    .nf-code { font-family: var(--display); font-weight: 700; font-size: clamp(6rem, 22vw, 11rem); letter-spacing: -0.06em; line-height: 1; }
    .nf p.muted { margin: 18px auto 36px; max-width: 360px; }
    .nf .mono { color: var(--violet); }
  </style>
</head>
<body>
  <main class="nf">
    <canvas id="neural" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;opacity:.6"></canvas>
    <div style="position:relative">
      <p class="mono">error 404</p>
      <h1 class="nf-code grad">404</h1>
      <p class="muted">This page drifted outside the training data.</p>
      <a href="/" class="btn btn-primary">Back home</a>
    </div>
  </main>
  <script>
    // lightweight version of the homepage network
    (() => {
      const c = document.getElementById("neural"), x = c.getContext("2d");
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      let w, h, n = [];
      const size = () => {
        const d = Math.min(devicePixelRatio || 1, 2);
        w = c.clientWidth; h = c.clientHeight; c.width = w * d; c.height = h * d; x.setTransform(d, 0, 0, d, 0, 0);
        n = Array.from({ length: Math.min(70, (w * h) / 16000 | 0) }, () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3 }));
      };
      const tick = () => {
        x.clearRect(0, 0, w, h);
        for (const p of n) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1; }
        for (let i = 0; i < n.length; i++) for (let j = i + 1; j < n.length; j++) {
          const d = Math.hypot(n[i].x - n[j].x, n[i].y - n[j].y);
          if (d < 130) { x.strokeStyle = `rgba(139,124,255,${(1 - d / 130) * .25})`; x.beginPath(); x.moveTo(n[i].x, n[i].y); x.lineTo(n[j].x, n[j].y); x.stroke(); }
        }
        x.fillStyle = "rgba(79,209,197,.8)";
        for (const p of n) { x.beginPath(); x.arc(p.x, p.y, 1.4, 0, 7); x.fill(); }
        requestAnimationFrame(tick);
      };
      size(); addEventListener("resize", size); tick();
    })();
  </script>
</body>
</html>
